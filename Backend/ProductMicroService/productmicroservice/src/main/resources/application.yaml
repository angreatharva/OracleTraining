server:
  port: ${PRODUCT_SERVER_PORT:8086}

spring:
  config:
    import:
      # Resolved against the process working directory, which varies: `mvn spring-boot:run`
      # uses the service folder, while an IDE run configuration usually uses the repository
      # or Backend root. All plausible roots are listed so the .env is found either way.
      - optional:file:./.env[.properties]
      - optional:file:ProductMicroService/productmicroservice/.env[.properties]
      - optional:file:Backend/ProductMicroService/productmicroservice/.env[.properties]

  application:
    name: ${PRODUCT_APPLICATION_NAME:PRODUCT-SERVICE}

  datasource:
    url: ${PRODUCT_DB_URL:jdbc:mysql://localhost:3306/mydb}
    driver-class-name: ${PRODUCT_DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${PRODUCT_DB_USERNAME:root}
    password: ${PRODUCT_DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${PRODUCT_JPA_DDL_AUTO:update}
    show-sql: ${PRODUCT_JPA_SHOW_SQL:true}

wealthtrack:
  jwt:
    # No default on purpose: a missing secret must fail startup rather than start the
    # service with an empty signing key. Must match every other service's value.
    secret: ${PRODUCT_JWT_SECRET}
    issuer: ${PRODUCT_JWT_ISSUER:wealthtrack}
    expiry-seconds: ${PRODUCT_JWT_EXPIRY_SECONDS:3600}

eureka:
  client:
    register-with-eureka: ${PRODUCT_EUREKA_REGISTER:true}
    fetch-registry: ${PRODUCT_EUREKA_FETCH_REGISTRY:true}
    service-url:
      defaultZone: ${PRODUCT_EUREKA_URL:http://localhost:8080/eureka/}
  instance:
    hostname: ${PRODUCT_EUREKA_HOSTNAME:localhost}
