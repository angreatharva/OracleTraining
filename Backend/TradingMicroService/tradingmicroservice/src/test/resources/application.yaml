spring:
  datasource:
    url: jdbc:h2:mem:trading_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

eureka:
  client:
    enabled: false

wealthtrack:
  jwt:
    # Test-only signing key; the real one comes from TRADING_JWT_SECRET in .env.
    secret: test-only-jwt-secret-not-used-outside-tests
    issuer: wealthtrack
    expiry-seconds: 3600
    service-token-seconds: 120
