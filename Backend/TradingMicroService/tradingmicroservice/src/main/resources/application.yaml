server:
  port: ${TRADING_SERVER_PORT:8085}

spring:
  config:
    import:
      # Resolved against the process working directory, which varies: `mvn spring-boot:run`
      # uses the service folder, while an IDE run configuration usually uses the repository
      # or Backend root. All plausible roots are listed so the .env is found either way.
      - optional:file:./.env[.properties]
      - optional:file:TradingMicroService/tradingmicroservice/.env[.properties]
      - optional:file:Backend/TradingMicroService/tradingmicroservice/.env[.properties]

  application:
    name: ${TRADING_APPLICATION_NAME:TRADING-SERVICE}

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${TRADING_FEIGN_CONNECT_TIMEOUT_MS:3000}
            readTimeout: ${TRADING_FEIGN_READ_TIMEOUT_MS:10000}

  datasource:
    url: ${TRADING_DB_URL:jdbc:mysql://localhost:3306/mydb}
    driver-class-name: ${TRADING_DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${TRADING_DB_USERNAME:root}
    password: ${TRADING_DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${TRADING_JPA_DDL_AUTO:update}
    show-sql: ${TRADING_JPA_SHOW_SQL:true}

wealthtrack:
  jwt:
    # No default on purpose: a missing secret must fail startup rather than start the
    # service with an empty signing key. Must match every other service's value.
    secret: ${TRADING_JWT_SECRET}
    issuer: ${TRADING_JWT_ISSUER:wealthtrack}
    expiry-seconds: ${TRADING_JWT_EXPIRY_SECONDS:3600}
    # Lifetime of the SERVICE tokens Trading mints for its Bank and Portfolio calls.
    service-token-seconds: ${TRADING_SERVICE_TOKEN_SECONDS:120}

eureka:
  client:
    register-with-eureka: ${TRADING_EUREKA_REGISTER:true}
    fetch-registry: ${TRADING_EUREKA_FETCH_REGISTRY:true}
    registry-fetch-interval-seconds: ${TRADING_EUREKA_FETCH_INTERVAL_SECONDS:5}
    service-url:
      defaultZone: ${TRADING_EUREKA_URL:http://localhost:8080/eureka/}
  instance:
    hostname: ${TRADING_EUREKA_HOSTNAME:localhost}
