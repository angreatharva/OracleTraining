  /api/bank-accounts:
    servers:
      - url: http://localhost:8083
        description: Bank Service direct
      - url: http://localhost:8081/bank
        description: Bank Service through API Gateway
    post:
      tags: [Bank - Accounts]
      operationId: createBankAccount
      summary: Register a bank account
      description: |
        Validates the referenced user through User Service, requires that user to be
        ACTIVE, normalizes the account number, and creates an ACTIVE account. The first
        account for a user becomes primary; requesting primary clears the user's other
        primary flags. The account number must be globally unique.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBankAccountRequest' }
            example:
              userId: 10
              bankName: HDFC Bank
              branchName: Andheri East
              accountNumber: '50100234567890'
              accountType: SAVINGS
              ifscCode: HDFC0001234
              openingBalance: 250000.00
              primaryAccount: true
      responses:
        '201':
          description: Bank account registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankAccountResponse' }
              example:
                bankAccountId: 1
                userId: 10
                bankName: HDFC Bank
                branchName: Andheri East
                maskedAccountNumber: "**********7890"
                accountType: SAVINGS
                ifscCode: HDFC0001234
                balance: 250000.00
                primaryAccount: true
                status: ACTIVE
                createdAt: '2026-07-30T10:20:00'
                updatedAt: '2026-07-30T10:20:00'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    get:
      tags: [Bank - Accounts]
      operationId: listBankAccounts
      summary: List and filter bank accounts
      description: Filters in memory by optional user ID, parsed status, and primary flag. An invalid status string returns 400.
      parameters:
        - name: userId
          in: query
          required: false
          schema: { type: integer, format: int64 }
          example: 10
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/BankAccountStatus' }
          example: ACTIVE
        - name: primary
          in: query
          required: false
          schema: { type: boolean }
          example: true
      responses:
        '200':
          description: Matching bank accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BankAccountResponse' }
              example:
                - bankAccountId: 1
                  userId: 10
                  bankName: HDFC Bank
                  branchName: Andheri East
                  maskedAccountNumber: "**********7890"
                  accountType: SAVINGS
                  ifscCode: HDFC0001234
                  balance: 250000.00
                  primaryAccount: true
                  status: ACTIVE
                  createdAt: '2026-07-30T10:20:00'
                  updatedAt: '2026-07-30T10:20:00'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/bank-accounts/{id}:
    servers:
      - url: http://localhost:8083
        description: Bank Service direct
      - url: http://localhost:8081/bank
        description: Bank Service through API Gateway
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Bank - Accounts]
      operationId: getBankAccountById
      summary: Get a bank account
      description: Returns account metadata, masked account number, and current balance.
      responses:
        '200':
          description: Bank account found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankAccountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [Bank - Accounts]
      operationId: updateBankAccount
      summary: Update mutable bank account fields
      description: Updates only non-null bank name, branch, account type, IFSC, and status fields. Setting CLOSED also clears the primary flag.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBankAccountRequest' }
            example:
              bankName: HDFC Bank
              branchName: Bandra Kurla Complex
              accountType: SAVINGS
              ifscCode: HDFC0004321
              status: ACTIVE
      responses:
        '200':
          description: Updated bank account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankAccountResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [Bank - Accounts]
      operationId: closeBankAccount
      summary: Close a bank account
      description: Soft-closes the account by setting status CLOSED and primaryAccount false; it does not delete the database row.
      responses:
        '204': { description: Account closed; no response body }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/bank-accounts/{id}/primary:
    servers:
      - url: http://localhost:8083
        description: Bank Service direct
      - url: http://localhost:8081/bank
        description: Bank Service through API Gateway
    patch:
      tags: [Bank - Accounts]
      operationId: makeBankAccountPrimary
      summary: Make an account primary
      description: Marks an ACTIVE account primary and clears the primary flag from the user's other accounts. No request body is accepted.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Updated primary account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankAccountResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/bank-accounts/{id}/debit:
    servers:
      - url: http://localhost:8083
        description: Bank Service direct
      - url: http://localhost:8081/bank
        description: Bank Service through API Gateway
    post:
      tags: [Bank - Accounts]
      operationId: debitBankAccount
      summary: Debit a bank account
      description: |
        Locks the account row and subtracts the amount when the account is ACTIVE and
        funded. Business rejection (inactive account or insufficient funds) still
        returns HTTP 200 with `approved: false`. Trading Service consumes this endpoint.
        The transaction reference is returned but is not persisted or deduplicated.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DebitRequest' }
            example: { amount: 1450.00, transactionReference: TRADE-8 }
      responses:
        '200':
          description: Debit decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DebitResult' }
              examples:
                approved:
                  value: { approved: true, reference: TRADE-8, failureReason: null }
                rejected:
                  value: { approved: false, reference: TRADE-8, failureReason: Insufficient balance }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/bank-accounts/{id}/credit:
    servers:
      - url: http://localhost:8083
        description: Bank Service direct
      - url: http://localhost:8081/bank
        description: Bank Service through API Gateway
    post:
      tags: [Bank - Accounts]
      operationId: creditBankAccount
      summary: Credit a bank account
      description: |
        Locks the account row and adds the amount unless the account is CLOSED.
        A CLOSED-account rejection is HTTP 200 with `successful: false`. Trading uses
        this for SELL proceeds and BUY compensation. References are not deduplicated.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreditRequest' }
            example: { amount: 1450.00, transactionReference: REVERSAL-TRADE-8 }
      responses:
        '200':
          description: Credit result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditResult' }
              examples:
                successful:
                  value: { successful: true, reference: REVERSAL-TRADE-8, failureReason: null }
                rejected:
                  value: { successful: false, reference: TRADE-8, failureReason: Cannot credit a CLOSED bank account }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/kyc-documents:
    servers:
      - url: http://localhost:8083
        description: Bank Service direct
      - url: http://localhost:8081/bank
        description: Bank Service through API Gateway
    post:
      tags: [Bank - KYC]
      operationId: createKycDocument
      summary: Submit a KYC document record
      description: Validates the ACTIVE user through User Service, normalizes the document number, and creates an ACTIVE/PENDING document. The document content itself is not uploaded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateKycDocumentRequest' }
            example:
              userId: 10
              documentType: PAN
              documentNumber: ABCDE1234F
              fileName: pan-card.pdf
      responses:
        '201':
          description: KYC document record created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycDocumentResponse' }
              example:
                kycDocumentId: 7
                userId: 10
                documentType: PAN
                maskedDocumentNumber: "******234F"
                fileName: pan-card.pdf
                verificationStatus: PENDING
                submittedDate: '2026-07-30'
                verifiedDate: null
                status: ACTIVE
                createdAt: '2026-07-30T10:30:00'
                updatedAt: '2026-07-30T10:30:00'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    get:
      tags: [Bank - KYC]
      operationId: listKycDocuments
      summary: List and filter KYC documents
      description: Filters by optional user ID, verification status, and document type. Enum strings are parsed case-insensitively by service code.
      parameters:
        - name: userId
          in: query
          schema: { type: integer, format: int64 }
          example: 10
        - name: verificationStatus
          in: query
          schema: { $ref: '#/components/schemas/VerificationStatus' }
          example: VERIFIED
        - name: documentType
          in: query
          schema: { $ref: '#/components/schemas/DocumentType' }
          example: PAN
      responses:
        '200':
          description: Matching KYC documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KycDocumentResponse' }
              example:
                - kycDocumentId: 7
                  userId: 10
                  documentType: PAN
                  maskedDocumentNumber: "******234F"
                  fileName: pan-card.pdf
                  verificationStatus: VERIFIED
                  submittedDate: '2026-07-30'
                  verifiedDate: '2026-07-30'
                  status: ACTIVE
                  createdAt: '2026-07-30T10:30:00'
                  updatedAt: '2026-07-30T10:35:00'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/kyc-documents/{id}:
    servers:
