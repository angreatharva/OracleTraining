    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Bank - KYC]
      operationId: getKycDocumentById
      summary: Get a KYC document record
      description: Returns metadata and a masked document number; the stored file is not served.
      responses:
        '200':
          description: KYC document found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KycDocumentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [Bank - KYC]
      operationId: deactivateKycDocument
      summary: Deactivate a KYC document
      description: Soft-deactivates the record by setting status INACTIVE.
      responses:
