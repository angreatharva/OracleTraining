    get:
      tags: [User - Details]
      operationId: getUserDetailByUserId
      summary: Get a detail record by user ID
      description: Finds the single profile associated with userId.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User detail found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
