        '200':
          description: Investment product found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestmentProductResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [Product - Products]
      operationId: updateInvestmentProduct
      summary: Replace an investment product
      description: Replaces every request field, revalidates the referenced product type and dates, and preserves global name uniqueness.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvestmentProductRequest' }
            example:
              productTypeId: 1
              productName: WealthTrack Nifty 50 ETF
              basePrice: 1400.00
              currentPrice: 1475.25
              minimumInvestment: 1475.25
              riskCategory: MODERATE
              priceMethod: MARKET
              tenureMonths: null
              interestRate: null
              issueDate: '2025-01-01'
              maturityDate: null
