                  closedDate: null
                  createdAt: '2026-07-30T10:50:00'
                  updatedAt: '2026-07-30T10:50:00'
                holdings:
                  - holdingId: 1
                    portfolioAccountId: 1
                    productId: 1
                    quantity: 101.0000
                    averageCost: 1400.4950
                    marketValue: 146450.0000
                    unrealizedGainLoss: 4999.9950
                    holdingStatus: ACTIVE
                    lastValuedAt: '2026-07-30T11:00:00'
                    createdAt: '2026-07-30T10:55:00'
                    updatedAt: '2026-07-30T11:00:00'
                totalCost: 141449.9950
                marketValue: 146450.0000
                unrealizedGainLoss: 5000.0050
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/trade-transactions:
    servers:
      - url: http://localhost:8085
        description: Trading Service direct
      - url: http://localhost:8081/trading
        description: Trading Service through API Gateway
    post:
      tags: [Trading - Transactions]
      operationId: createTradeTransaction
      summary: Execute a BUY or SELL trade
      description: |
        Persists PENDING, obtains Product Service's active currentPrice (the request's
        unitPrice is therefore overwritten), validates the Portfolio, then runs a
        synchronous saga:

        * BUY: Bank debit -> Portfolio apply; credit compensation on Portfolio failure.
        * SELL: Portfolio apply -> Bank credit; reverse Portfolio command on credit failure.

        A completed trade returns 201. Any caught execution failure is persisted as
        FAILED and returned as 422 with the same TradeTransactionResponse shape and a
        failureReason. The external calls and compensations are not globally atomic.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTradeTransactionRequest' }
            example:
              portfolioAccountId: 1
              holdingId: 1
              productId: 1
              bankAccountId: 1
              transactionType: BUY
              quantity: 1.00
              unitPrice: 1450.00
      responses:
        '201':
          description: Trade completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradeTransactionResponse' }
              example:
                transactionId: 8
                portfolioAccountId: 1
                holdingId: 1
                productId: 1
                transactionType: BUY
                quantity: 1.00
                unitPrice: 1450.00
                totalAmount: 1450.00
                transactionStatus: COMPLETED
                transactionDate: '2026-07-30T11:00:00'
                failureReason: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Trade was accepted for execution but failed; this is a persisted business result, not the standard error envelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradeTransactionResponse' }
              example:
                transactionId: 9
                portfolioAccountId: 1
                holdingId: 1
                productId: 1
                transactionType: BUY
                quantity: 1.00
                unitPrice: 1450.00
                totalAmount: 1450.00
                transactionStatus: FAILED
                transactionDate: '2026-07-30T11:05:00'
                failureReason: Insufficient balance
        '500': { $ref: '#/components/responses/InternalServerError' }
    get:
      tags: [Trading - Transactions]
      operationId: listTradeTransactions
      summary: List and filter trades
      description: Filters stored transactions by optional portfolio ID, case-insensitive status/type strings, and inclusive transactionDate boundaries. Unknown status/type values simply produce no matching rows.
      parameters:
        - name: portfolioAccountId
          in: query
          schema: { type: integer, format: int64 }
          example: 1
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TransactionStatus' }
          example: COMPLETED
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/TransactionType' }
          example: BUY
        - name: startDate
          in: query
          description: Inclusive ISO-8601 local date-time; no timezone offset is modeled by LocalDateTime.
          schema: { type: string, format: date-time }
          example: '2026-07-01T00:00:00'
        - name: endDate
          in: query
          description: Inclusive ISO-8601 local date-time.
          schema: { type: string, format: date-time }
          example: '2026-07-31T23:59:59'
      responses:
        '200':
          description: Matching trades
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TradeTransactionResponse' }
              example:
                - transactionId: 8
                  portfolioAccountId: 1
                  holdingId: 1
                  productId: 1
                  transactionType: BUY
                  quantity: 1.00
                  unitPrice: 1450.00
                  totalAmount: 1450.00
                  transactionStatus: COMPLETED
                  transactionDate: '2026-07-30T11:00:00'
                  failureReason: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/trade-transactions/{id}:
    servers:
      - url: http://localhost:8085
        description: Trading Service direct
      - url: http://localhost:8081/trading
        description: Trading Service through API Gateway
    get:
      tags: [Trading - Transactions]
      operationId: getTradeTransaction
      summary: Get a trade
      description: Returns one stored trade. failureReason is not persisted by the entity and is therefore null when a previously failed trade is read back.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Trade found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradeTransactionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/portfolio-statements/internal:
    servers:
      - url: http://localhost:8085
        description: Trading Service direct
      - url: http://localhost:8081/trading
        description: Trading Service through API Gateway
    post:
      tags: [Trading - Statements]
      operationId: createPortfolioStatement
      summary: Generate a portfolio statement record
      description: |
        Internal-named but unauthenticated endpoint. Validates the date range, loads the
        required primary transaction plus unique non-null transactionIds from Trading's
        database, and creates a GENERATED statement. It does not call Portfolio Service
        or calculate opening/closing values; callers supply those values.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePortfolioStatementRequest' }
            example:
              portfolioAccountId: 1
              holdingId: 1
              transactionId: 8
              statementStart: '2026-07-01'
              statementEnd: '2026-07-31'
              openingValue: 140000.00
              closingValue: 146450.00
              transactionIds: [8, 10, 11]
      responses:
        '201':
          description: Statement generated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioStatementResponse' }
              example:
                statementId: 4
                portfolioAccountId: 1
                holdingId: 1
                transactionId: 8
                statementStart: '2026-07-01'
                statementEnd: '2026-07-31'
                openingValue: 140000.00
                closingValue: 146450.00
                generatedAt: '2026-07-30T11:10:00'
                status: GENERATED
                transactionIds: [8, 10, 11]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/portfolio-statements:
    servers:
      - url: http://localhost:8085
        description: Trading Service direct
      - url: http://localhost:8081/trading
        description: Trading Service through API Gateway
    get:
      tags: [Trading - Statements]
      operationId: listPortfolioStatements
      summary: List and filter portfolio statements
      description: Filters by optional portfolio ID, case-insensitive status string, statementStart lower bound, and statementEnd upper bound.
      parameters:
        - name: portfolioAccountId
          in: query
          schema: { type: integer, format: int64 }
          example: 1
        - name: status
          in: query
          schema: { type: string }
          description: The implementation creates GENERATED; the field is a free-form string in storage.
          example: GENERATED
        - name: startDate
          in: query
          schema: { type: string, format: date }
          example: '2026-07-01'
        - name: endDate
          in: query
          schema: { type: string, format: date }
          example: '2026-07-31'
      responses:
        '200':
          description: Matching statements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PortfolioStatementResponse' }
              example:
                - statementId: 4
                  portfolioAccountId: 1
                  holdingId: 1
                  transactionId: 8
                  statementStart: '2026-07-01'
                  statementEnd: '2026-07-31'
                  openingValue: 140000.00
                  closingValue: 146450.00
                  generatedAt: '2026-07-30T11:10:00'
                  status: GENERATED
                  transactionIds: [8, 10, 11]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/portfolio-statements/{id}:
    servers:
      - url: http://localhost:8085
        description: Trading Service direct
      - url: http://localhost:8081/trading
        description: Trading Service through API Gateway
    get:
      tags: [Trading - Statements]
      operationId: getPortfolioStatement
      summary: Get a portfolio statement
      description: Returns one generated statement and its associated transaction IDs.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Statement found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioStatementResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/investment-overview/users/{userId}:
    servers:
      - url: http://localhost:8085
        description: Trading Service direct
      - url: http://localhost:8081/trading
        description: Trading Service through API Gateway
    get:
      tags: [Trading - Overview]
      operationId: getInvestmentOverview
      summary: Get a user's consolidated investment overview
      description: |
        Fetches the user's portfolio and holdings from Portfolio Service, reads
        completed trades from Trading's database, and fetches current product details
        from Product Service once per represented product. Calculates bought/sold/current
        quantities, weighted average buy price, invested value, current valuation, and
        profit/loss. The Trading exception handler has no generic catch-all; an uncaught
        Feign/runtime failure therefore uses Spring's default 500 response, whose exact
        body cannot be fully determined from this controller code.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Consolidated investment overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvestmentOverviewResponse' }
              example:
                userId: 10
                portfolioAccountId: 1
                positions:
                  - productId: 1
                    productName: WealthTrack Nifty 50 ETF
                    boughtQuantity: 101.0000
                    soldQuantity: 0.0000
                    currentQuantity: 101.0000
                    averageBuyPrice: 1400.4950
                    currentPrice: 1450.0000
                    investedValue: 141449.9950
                    currentValuation: 146450.0000
                    profitLoss: 5000.0050
                    lastTransactionDate: '2026-07-30T11:00:00'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        HS256 token issued by POST /api/auth/login. Send it as
        `Authorization: Bearer <token>`. Validated by the API Gateway and again by each
        business service independently, because ports 8082-8086 are directly reachable.
        Claims: sub/userId, roleId, role (MANAGER or INVESTOR), managerId, email, iss, exp.

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Resource identifier
      schema: { type: integer, format: int64, minimum: 1 }
      example: 1
    UserId:
      name: userId
      in: path
      required: true
      description: User identifier
      schema: { type: integer, format: int64, minimum: 1 }
      example: 10
    RoleId:
      name: roleId
      in: path
      required: true
      description: Role identifier
      schema: { type: integer, format: int64, minimum: 1 }
      example: 1
    PortfolioAccountId:
      name: portfolioAccountId
      in: path
      required: true
      description: Portfolio account identifier
      schema: { type: integer, format: int64, minimum: 1 }
      example: 1
    HoldingId:
      name: holdingId
      in: path
      required: true
      description: Portfolio holding identifier
      schema: { type: integer, format: int64, minimum: 1 }
      example: 1

  responses:
    BadRequest:
      description: Request validation, enum parsing, date-range, or business-rule failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StandardApiError' }
          examples:
            validation:
              summary: Validation error
              value:
                timestamp: '2026-07-30T11:15:00'
                status: 400
                error: Bad Request
                message: Request validation failed
                path: /api/bank-accounts
                fieldErrors:
                  accountNumber: must not be blank
            businessRule:
              summary: Business-rule error
              value:
                timestamp: '2026-07-30T11:15:00'
                status: 400
                message: Portfolio account 1 is not active
    Unauthorized:
      description: |
        Reusable 401 template. No reviewed service currently authenticates requests, so
        this response is not emitted by application security in the current code.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StandardApiError' }
          example:
            timestamp: '2026-07-30T11:15:00'
            status: 401
            error: Unauthorized
            message: Authentication is required
            path: /api/example
    Forbidden:
      description: |
        Reusable 403 template. No reviewed service currently enforces roles or
        permissions, so this response is not emitted by application authorization.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StandardApiError' }
          example:
            timestamp: '2026-07-30T11:15:00'
            status: 403
            error: Forbidden
            message: The authenticated principal cannot perform this operation
            path: /api/example
    NotFound:
      description: Requested resource does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StandardApiError' }
          example:
            timestamp: '2026-07-30T11:15:00'
            status: 404
            error: Not Found
            message: Resource not found
            path: /api/example/999
    Conflict:
      description: Duplicate or data-integrity conflict; only handlers that map conflicts return this status
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StandardApiError' }
          example:
            timestamp: '2026-07-30T11:15:00'
            status: 409
            error: Conflict
            message: The record conflicts with existing data
            path: /api/example
    UnprocessableEntity:
      description: Reusable 422 error template. Trading's create operation instead returns a failed TradeTransactionResponse for its implemented 422.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StandardApiError' }
          example:
            timestamp: '2026-07-30T11:15:00'
            status: 422
            error: Unprocessable Entity
            message: The request was valid but could not be processed
            path: /api/example
    InternalServerError:
      description: |
        Unexpected server or dependency failure. Bank and Portfolio define this envelope
        explicitly. User, Product, Trading, and Gateway may fall through to Spring's
        default error handling, so their exact 500 body is not fully determined.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StandardApiError' }
          example:
            timestamp: '2026-07-30T11:15:00'
            status: 500
            error: Internal Server Error
            message: Internal server error
            path: /api/example

  examples:
    GetResponseTemplate:
      summary: Reusable GET response template
      description: Replace the payload fields with the response schema for the selected GET operation.
      value:
        id: 1
        status: ACTIVE
    PostRequestTemplate:
      summary: Reusable POST request template
      value:
        requiredField: realistic-value
    PostResponseTemplate:
      summary: Reusable 201 response template
      value:
        id: 1
        createdAt: '2026-07-30T11:15:00'
    PutRequestTemplate:
      summary: Reusable full-replacement PUT request template
      value:
        allRequiredFields: supply-all-required-fields
    PutResponseTemplate:
      summary: Reusable PUT response template
      value:
        id: 1
        updatedAt: '2026-07-30T11:20:00'
    PatchRequestTemplate:
      summary: Reusable partial-update PATCH request template
      value:
        fieldToChange: new-value
    PatchResponseTemplate:
      summary: Reusable PATCH response template
      value:
        id: 1
        fieldToChange: new-value
    DeleteResponseTemplate:
      summary: Reusable DELETE response template
      description: A successful DELETE in this repository returns 204 with no body.
      value: null

  schemas:
    StandardApiError:
      type: object
      description: |
        Superset reusable error envelope covering the three code-defined formats. Only
        `timestamp`, `status`, and `message` are common to all custom handlers. Optional
        fields appear in Bank/Portfolio handlers. Spring default errors can contain
        additional fields.
      required: [timestamp, status, message]
      properties:
        timestamp:
          type: string
          format: date-time
          example: '2026-07-30T11:15:00'
        status:
          type: integer
          format: int32
          example: 400
        error:
          type: string
          nullable: true
          example: Bad Request
        message:
          type: string
          example: Request validation failed
        path:
          type: string
          nullable: true
          example: /api/bank-accounts
        fieldErrors:
          type: object
          nullable: true
          additionalProperties: { type: string }
          example: { accountNumber: must not be blank }
        validationErrors:
          type: object
          nullable: true
          additionalProperties: { type: string }
          example: { quantity: must be greater than or equal to 0.0001 }

    UserStatus:
      type: string
      enum: [ACTIVE, INACTIVE, SUSPENDED]
    KycStatus:
      type: string
      enum: [PENDING, VERIFIED, REJECTED]
    RiskLevel:
      type: string
      enum: [LOW, MODERATE, HIGH]
    CreateRoleRequest:
      type: object
      required: [roleName]
      properties:
        roleName:
          type: string
          minLength: 1
          maxLength: 100
          example: CUSTOMER
    RoleResponse:
      type: object
      required: [roleId, roleName]
      properties:
        roleId: { type: integer, format: int64, example: 1 }
        roleName: { type: string, example: CUSTOMER }
    CreateUserRequest:
      type: object
      required: [roleId, password, email, fullName]
      properties:
        roleId: { type: integer, format: int64, minimum: 1, example: 1 }
        managerId: { type: integer, format: int64, minimum: 1, nullable: true, example: 2 }
        password:
          type: string
          minLength: 8
          writeOnly: true
          description: >
            Plaintext. BCrypt-hashed by the server before storage and never returned.
            Replaced the old `passwordHash` field, which was stored exactly as sent and so
            could never be verified at login.
          example: "Investor@123"
        email: { type: string, format: email, minLength: 1, example: atharva.angre@example.com }
        fullName: { type: string, minLength: 1, example: Atharva Angre }
        phone: { type: string, nullable: true, example: "+919876543210" }
        status:
          allOf:
            - $ref: '#/components/schemas/UserStatus'
          nullable: true
          default: ACTIVE
    UpdateUserRequest:
      type: object
      description: >
        Full replacement of a user's profile. Split from CreateUserRequest so an edit does
        not have to resend a password; use POST /api/auth/change-password for that.
      required: [roleId, email, fullName]
      properties:
        roleId: { type: integer, format: int64, minimum: 1, example: 1 }
        managerId: { type: integer, format: int64, minimum: 1, nullable: true, example: 2 }
        email: { type: string, format: email, minLength: 1, example: atharva.angre@example.com }
        fullName: { type: string, minLength: 1, example: Atharva Angre }
        phone: { type: string, nullable: true, example: "+919876543210" }
        status:
          allOf:
            - $ref: '#/components/schemas/UserStatus'
          nullable: true
          default: ACTIVE

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: priya.shah@wealthtrack.test }
        password: { type: string, format: password, example: "Manager@123" }

    LoginResponse:
      type: object
      required: [token, expiresAt, roleName, user]
      properties:
        token:
          type: string
          description: Send as `Authorization: Bearer <token>`.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expiresAt: { type: string, format: date-time, example: '2026-08-04T21:47:25' }
        roleName:
          type: string
          enum: [MANAGER, INVESTOR]
          example: MANAGER
        user: { $ref: '#/components/schemas/UserResponse' }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password, example: "Manager@123" }
        newPassword: { type: string, format: password, minLength: 8, example: "NewPass@456" }

    UserResponse:
      type: object
      required: [userId, roleId, email, fullName, status, createdAt, updatedAt]
      properties:
        userId: { type: integer, format: int64, example: 10 }
        roleId: { type: integer, format: int64, example: 1 }
        managerId: { type: integer, format: int64, nullable: true, example: 2 }
        email: { type: string, format: email, example: atharva.angre@example.com }
        fullName: { type: string, example: Atharva Angre }
        phone: { type: string, nullable: true, example: "+919876543210" }
        status: { $ref: '#/components/schemas/UserStatus' }
        createdAt: { type: string, format: date-time, example: '2026-07-30T10:15:30' }
        updatedAt: { type: string, format: date-time, example: '2026-07-30T10:15:30' }
    CreateUserDetailRequest:
      type: object
      required: [userId]
      properties:
        userId: { type: integer, format: int64, minimum: 1, example: 10 }
        dateOfBirth: { type: string, format: date, nullable: true, example: '1998-04-12' }
        riskLevel:
          allOf: [{ $ref: '#/components/schemas/RiskLevel' }]
          nullable: true
        riskScore: { type: integer, format: int32, nullable: true, example: 62 }
        kycStatus:
          allOf: [{ $ref: '#/components/schemas/KycStatus' }]
          nullable: true
    UserDetailResponse:
      type: object
      required: [userDetailId, userId]
      properties:
        userDetailId: { type: integer, format: int64, example: 5 }
        userId: { type: integer, format: int64, example: 10 }
        dateOfBirth: { type: string, format: date, nullable: true, example: '1998-04-12' }
        riskLevel:
          allOf: [{ $ref: '#/components/schemas/RiskLevel' }]
          nullable: true
        riskScore: { type: integer, format: int32, nullable: true, example: 62 }
        kycStatus:
          allOf: [{ $ref: '#/components/schemas/KycStatus' }]
          nullable: true

    AccountType:
      type: string
      enum: [SAVINGS, CURRENT, SALARY, NRE, NRO, OTHER]
    BankAccountStatus:
      type: string
      enum: [ACTIVE, INACTIVE, BLOCKED, CLOSED]
    DocumentType:
      type: string
      enum: [PAN, AADHAAR, PASSPORT, DRIVING_LICENSE, VOTER_ID, OTHER]
    VerificationStatus:
      type: string
      enum: [PENDING, VERIFIED, REJECTED]
    RecordStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    CreateBankAccountRequest:
      type: object
      required: [userId, bankName, accountNumber, accountType]
      properties:
        userId: { type: integer, format: int64, minimum: 1, example: 10 }
        bankName: { type: string, minLength: 1, maxLength: 120, example: HDFC Bank }
        branchName: { type: string, maxLength: 120, nullable: true, example: Andheri East }
        accountNumber: { type: string, minLength: 1, maxLength: 50, example: '50100234567890' }
        accountType:
          description: Case-insensitive enum string parsed by the service.
          allOf: [{ $ref: '#/components/schemas/AccountType' }]
        ifscCode:
          type: string
          nullable: true
          pattern: '^[A-Za-z]{4}0[A-Za-z0-9]{6}$'
          example: HDFC0001234
        openingBalance: { type: number, minimum: 0, nullable: true, default: 0, example: 250000.00 }
        primaryAccount: { type: boolean, nullable: true, default: false, example: true }
    UpdateBankAccountRequest:
      type: object
      properties:
        bankName: { type: string, minLength: 1, maxLength: 120, nullable: true, example: HDFC Bank }
        branchName: { type: string, maxLength: 120, nullable: true, example: Bandra Kurla Complex }
        accountType:
          allOf: [{ $ref: '#/components/schemas/AccountType' }]
          nullable: true
        ifscCode:
          type: string
          nullable: true
          pattern: '^[A-Za-z]{4}0[A-Za-z0-9]{6}$'
          example: HDFC0004321
        status:
          allOf: [{ $ref: '#/components/schemas/BankAccountStatus' }]
          nullable: true
    BankAccountResponse:
      type: object
      required: [bankAccountId, userId, bankName, maskedAccountNumber, accountType, balance, primaryAccount, status, createdAt, updatedAt]
      properties:
        bankAccountId: { type: integer, format: int64, example: 1 }
        userId: { type: integer, format: int64, example: 10 }
        bankName: { type: string, example: HDFC Bank }
        branchName: { type: string, nullable: true, example: Andheri East }
        maskedAccountNumber: { type: string, example: "**********7890" }
        accountType: { $ref: '#/components/schemas/AccountType' }
        ifscCode: { type: string, nullable: true, example: HDFC0001234 }
        balance: { type: number, example: 250000.00 }
        primaryAccount: { type: boolean, example: true }
        status: { $ref: '#/components/schemas/BankAccountStatus' }
        createdAt: { type: string, format: date-time, example: '2026-07-30T10:20:00' }
        updatedAt: { type: string, format: date-time, example: '2026-07-30T10:20:00' }
    DebitRequest:
      type: object
      required: [amount, transactionReference]
      properties:
        amount: { type: number, minimum: 0.01, example: 1450.00 }
        transactionReference: { type: string, minLength: 1, example: TRADE-8 }
    CreditRequest:
      type: object
      required: [amount, transactionReference]
      properties:
        amount: { type: number, minimum: 0.01, example: 1450.00 }
        transactionReference: { type: string, minLength: 1, example: REVERSAL-TRADE-8 }
    DebitResult:
      type: object
      required: [approved, reference]
      properties:
        approved: { type: boolean, example: true }
        reference: { type: string, example: TRADE-8 }
        failureReason: { type: string, nullable: true, example: null }
    CreditResult:
      type: object
      required: [successful, reference]
      properties:
        successful: { type: boolean, example: true }
        reference: { type: string, example: TRADE-8 }
        failureReason: { type: string, nullable: true, example: null }
    CreateKycDocumentRequest:
      type: object
      required: [userId, documentType, documentNumber]
      properties:
        userId: { type: integer, format: int64, minimum: 1, example: 10 }
        documentType:
          description: Case-insensitive enum string parsed by the service.
          allOf: [{ $ref: '#/components/schemas/DocumentType' }]
        documentNumber: { type: string, minLength: 1, maxLength: 100, example: ABCDE1234F }
        fileName: { type: string, maxLength: 255, nullable: true, example: pan-card.pdf }
    UpdateKycVerificationRequest:
      type: object
      required: [verificationStatus]
      properties:
        verificationStatus:
          allOf: [{ $ref: '#/components/schemas/VerificationStatus' }]
    KycDocumentResponse:
      type: object
      required: [kycDocumentId, userId, documentType, maskedDocumentNumber, verificationStatus, submittedDate, status, createdAt, updatedAt]
      properties:
        kycDocumentId: { type: integer, format: int64, example: 7 }
        userId: { type: integer, format: int64, example: 10 }
        documentType: { $ref: '#/components/schemas/DocumentType' }
        maskedDocumentNumber: { type: string, example: "******234F" }
        fileName: { type: string, nullable: true, example: pan-card.pdf }
        verificationStatus: { $ref: '#/components/schemas/VerificationStatus' }
        submittedDate: { type: string, format: date, example: '2026-07-30' }
        verifiedDate: { type: string, format: date, nullable: true, example: '2026-07-30' }
        status: { $ref: '#/components/schemas/RecordStatus' }
        createdAt: { type: string, format: date-time, example: '2026-07-30T10:30:00' }
        updatedAt: { type: string, format: date-time, example: '2026-07-30T10:35:00' }

    ProductStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    RiskCategory:
      type: string
      enum: [LOW, MODERATE, HIGH]
    PriceMethod:
      type: string
      enum: [MARKET, NAV, FIXED]
    CreateProductTypeRequest:
      type: object
      required: [typeCode, typeName]
      properties:
        typeCode: { type: string, minLength: 1, maxLength: 255, example: EQUITY }
        typeName: { type: string, minLength: 1, maxLength: 255, example: Listed Equity }
        description: { type: string, maxLength: 255, nullable: true, example: Exchange-listed equity instruments }
        status:
          allOf: [{ $ref: '#/components/schemas/ProductStatus' }]
          nullable: true
          default: ACTIVE
    ProductTypeResponse:
      type: object
      required: [productTypeId, typeCode, typeName, status, createdAt, updatedAt]
      properties:
        productTypeId: { type: integer, format: int64, example: 1 }
        typeCode: { type: string, example: EQUITY }
        typeName: { type: string, example: Listed Equity }
        description: { type: string, nullable: true, example: Exchange-listed equity instruments }
        status: { $ref: '#/components/schemas/ProductStatus' }
        createdAt: { type: string, format: date-time, example: '2026-07-30T10:40:00' }
        updatedAt: { type: string, format: date-time, example: '2026-07-30T10:40:00' }
    CreateInvestmentProductRequest:
      type: object
      required: [productTypeId, productName, basePrice, currentPrice, minimumInvestment, riskCategory, priceMethod]
      properties:
        productTypeId: { type: integer, format: int64, minimum: 1, example: 1 }
        productName: { type: string, minLength: 1, maxLength: 255, example: WealthTrack Nifty 50 ETF }
        basePrice: { type: number, minimum: 0.01, example: 1400.00 }
        currentPrice: { type: number, minimum: 0.01, example: 1450.00 }
        minimumInvestment: { type: number, minimum: 0.01, example: 1450.00 }
        riskCategory: { $ref: '#/components/schemas/RiskCategory' }
        priceMethod: { $ref: '#/components/schemas/PriceMethod' }
        tenureMonths: { type: integer, format: int32, minimum: 1, nullable: true, example: 36 }
        interestRate: { type: number, minimum: 0, nullable: true, example: 7.25 }
        issueDate: { type: string, format: date, nullable: true, example: '2025-01-01' }
        maturityDate: { type: string, format: date, nullable: true, example: '2028-01-01' }
        status:
          allOf: [{ $ref: '#/components/schemas/ProductStatus' }]
          nullable: true
          default: ACTIVE
    InvestmentProductResponse:
      type: object
      required: [productId, productTypeId, productTypeCode, productName, basePrice, currentPrice, minimumInvestment, riskCategory, priceMethod, status, active, createdAt, updatedAt]
      properties:
        productId: { type: integer, format: int64, example: 1 }
        productTypeId: { type: integer, format: int64, example: 1 }
        productTypeCode: { type: string, example: EQUITY }
        productName: { type: string, example: WealthTrack Nifty 50 ETF }
        basePrice: { type: number, example: 1400.00 }
        currentPrice: { type: number, example: 1450.00 }
        minimumInvestment: { type: number, example: 1450.00 }
        riskCategory: { $ref: '#/components/schemas/RiskCategory' }
        priceMethod: { $ref: '#/components/schemas/PriceMethod' }
        tenureMonths: { type: integer, format: int32, nullable: true, example: 36 }
        interestRate: { type: number, nullable: true, example: 7.25 }
        issueDate: { type: string, format: date, nullable: true, example: '2025-01-01' }
        maturityDate: { type: string, format: date, nullable: true, example: '2028-01-01' }
        status: { $ref: '#/components/schemas/ProductStatus' }
        active: { type: boolean, example: true }
        createdAt: { type: string, format: date-time, example: '2026-07-30T10:45:00' }
        updatedAt: { type: string, format: date-time, example: '2026-07-30T10:45:00' }

    AccountStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, CLOSED]
    HoldingStatus:
      type: string
      enum: [ACTIVE, MATURED, CLOSED]
    CreatePortfolioAccountRequest:
      type: object
      required: [userId]
      properties:
        userId: { type: integer, format: int64, example: 10 }
        openedDate: { type: string, format: date, nullable: true, example: '2026-07-30' }
    UpdatePortfolioStatusRequest:
      type: object
      required: [accountStatus]
      properties:
        accountStatus: { $ref: '#/components/schemas/AccountStatus' }
    PortfolioAccountResponse:
      type: object
      required: [portfolioAccountId, userId, accountStatus, openedDate, createdAt, updatedAt]
      properties:
        portfolioAccountId: { type: integer, format: int64, example: 1 }
        userId: { type: integer, format: int64, example: 10 }
        accountStatus: { $ref: '#/components/schemas/AccountStatus' }
        openedDate: { type: string, format: date, example: '2026-07-30' }
        closedDate: { type: string, format: date, nullable: true, example: null }
        createdAt: { type: string, format: date-time, example: '2026-07-30T10:50:00' }
        updatedAt: { type: string, format: date-time, example: '2026-07-30T10:50:00' }
    CreateHoldingRequest:
      type: object
      required: [productId, quantity, averageCost]
      properties:
        productId:
          type: integer
          format: int64
          description: "@NotNull is present in source; positivity is not validated by this DTO."
          example: 1
        quantity: { type: number, minimum: 0.0001, example: 100.0000 }
        averageCost: { type: number, minimum: 0, example: 1400.0000 }
    UpdateHoldingRequest:
      type: object
      properties:
        quantity: { type: number, minimum: 0, nullable: true, example: 105.0000 }
        averageCost: { type: number, minimum: 0, nullable: true, example: 1402.3810 }
        holdingStatus:
          allOf: [{ $ref: '#/components/schemas/HoldingStatus' }]
          nullable: true
    PortfolioHoldingResponse:
      type: object
      required: [holdingId, portfolioAccountId, productId, quantity, averageCost, marketValue, unrealizedGainLoss, holdingStatus, lastValuedAt, createdAt, updatedAt]
      properties:
        holdingId: { type: integer, format: int64, example: 1 }
        portfolioAccountId: { type: integer, format: int64, example: 1 }
        productId: { type: integer, format: int64, example: 1 }
        quantity: { type: number, example: 101.0000 }
        averageCost: { type: number, example: 1400.4950 }
        marketValue: { type: number, example: 146450.0000 }
        unrealizedGainLoss: { type: number, example: 5000.0050 }
        holdingStatus: { $ref: '#/components/schemas/HoldingStatus' }
        lastValuedAt: { type: string, format: date-time, example: '2026-07-30T11:00:00' }
        createdAt: { type: string, format: date-time, example: '2026-07-30T10:55:00' }
        updatedAt: { type: string, format: date-time, example: '2026-07-30T11:00:00' }
    ApplyTradeRequest:
      type: object
      description: Portfolio DTO and Trading HoldingUpdateRequest have the same field names and compatible JSON structure.
      required: [portfolioAccountId, holdingId, productId, transactionType, quantity, unitPrice, transactionId]
      properties:
        portfolioAccountId: { type: integer, format: int64, minimum: 1, example: 1 }
        holdingId: { type: integer, format: int64, minimum: 1, example: 1 }
        productId: { type: integer, format: int64, minimum: 1, example: 1 }
        transactionType: { $ref: '#/components/schemas/TransactionType' }
        quantity: { type: number, minimum: 0.0001, example: 1.0000 }
        unitPrice: { type: number, minimum: 0.0001, example: 1450.0000 }
        transactionId: { type: integer, format: int64, minimum: 1, example: 8 }
    PortfolioSummaryResponse:
      type: object
      required: [portfolioAccount, holdings, totalCost, marketValue, unrealizedGainLoss]
      properties:
        portfolioAccount: { $ref: '#/components/schemas/PortfolioAccountResponse' }
        holdings:
          type: array
          items: { $ref: '#/components/schemas/PortfolioHoldingResponse' }
        totalCost: { type: number, example: 141449.9950 }
        marketValue: { type: number, example: 146450.0000 }
        unrealizedGainLoss: { type: number, example: 5000.0050 }

    TransactionType:
      type: string
      enum: [BUY, SELL]
    TransactionStatus:
      type: string
      enum: [PENDING, COMPLETED, FAILED, REVERSED]
    CreateTradeTransactionRequest:
      type: object
      required: [portfolioAccountId, holdingId, productId, bankAccountId, transactionType, quantity, unitPrice]
      properties:
        portfolioAccountId: { type: integer, format: int64, minimum: 1, example: 1 }
        holdingId: { type: integer, format: int64, minimum: 1, example: 1 }
        productId: { type: integer, format: int64, minimum: 1, example: 1 }
        bankAccountId: { type: integer, format: int64, minimum: 1, example: 1 }
        transactionType:
          description: Parsed case-insensitively; only BUY and SELL are accepted.
          allOf: [{ $ref: '#/components/schemas/TransactionType' }]
        quantity: { type: number, minimum: 0.01, example: 1.00 }
        unitPrice:
          type: number
          minimum: 0.01
          description: Required and validated, but execution replaces it with Product Service currentPrice.
          example: 1450.00
    TradeTransactionResponse:
      type: object
      required: [transactionId, portfolioAccountId, holdingId, productId, transactionType, quantity, unitPrice, totalAmount, transactionStatus, transactionDate]
      properties:
        transactionId: { type: integer, format: int64, example: 8 }
        portfolioAccountId: { type: integer, format: int64, example: 1 }
        holdingId: { type: integer, format: int64, example: 1 }
        productId: { type: integer, format: int64, example: 1 }
        transactionType: { $ref: '#/components/schemas/TransactionType' }
        quantity: { type: number, example: 1.00 }
        unitPrice: { type: number, example: 1450.00 }
        totalAmount: { type: number, example: 1450.00 }
        transactionStatus: { $ref: '#/components/schemas/TransactionStatus' }
        transactionDate: { type: string, format: date-time, example: '2026-07-30T11:00:00' }
        failureReason:
          type: string
          nullable: true
          description: Populated only in the immediate 422 response; the entity does not persist this field.
          example: null
    CreatePortfolioStatementRequest:
      type: object
      required: [portfolioAccountId, holdingId, transactionId, statementStart, statementEnd, openingValue, closingValue]
      properties:
        portfolioAccountId: { type: integer, format: int64, minimum: 1, example: 1 }
        holdingId: { type: integer, format: int64, minimum: 1, example: 1 }
        transactionId: { type: integer, format: int64, minimum: 1, example: 8 }
        statementStart: { type: string, format: date, example: '2026-07-01' }
        statementEnd: { type: string, format: date, example: '2026-07-31' }
        openingValue: { type: number, minimum: 0, example: 140000.00 }
        closingValue: { type: number, minimum: 0, example: 146450.00 }
        transactionIds:
          type: array
          nullable: true
          items: { type: integer, format: int64 }
          example: [8, 10, 11]
    PortfolioStatementResponse:
      type: object
      required: [statementId, portfolioAccountId, holdingId, transactionId, statementStart, statementEnd, openingValue, closingValue, generatedAt, status, transactionIds]
      properties:
        statementId: { type: integer, format: int64, example: 4 }
        portfolioAccountId: { type: integer, format: int64, example: 1 }
        holdingId: { type: integer, format: int64, example: 1 }
        transactionId: { type: integer, format: int64, example: 8 }
        statementStart: { type: string, format: date, example: '2026-07-01' }
        statementEnd: { type: string, format: date, example: '2026-07-31' }
        openingValue: { type: number, example: 140000.00 }
        closingValue: { type: number, example: 146450.00 }
        generatedAt: { type: string, format: date-time, example: '2026-07-30T11:10:00' }
        status:
          type: string
          description: The implementation writes GENERATED; no enum type is declared.
          example: GENERATED
        transactionIds:
          type: array
          items: { type: integer, format: int64 }
          example: [8, 10, 11]
    InvestmentPositionResponse:
      type: object
      required: [productId, boughtQuantity, soldQuantity, currentQuantity, averageBuyPrice, currentPrice, investedValue, currentValuation, profitLoss]
      properties:
        productId: { type: integer, format: int64, example: 1 }
        productName: { type: string, nullable: true, example: WealthTrack Nifty 50 ETF }
        boughtQuantity: { type: number, example: 101.0000 }
        soldQuantity: { type: number, example: 0.0000 }
        currentQuantity: { type: number, example: 101.0000 }
        averageBuyPrice: { type: number, example: 1400.4950 }
        currentPrice: { type: number, example: 1450.0000 }
        investedValue: { type: number, example: 141449.9950 }
        currentValuation: { type: number, example: 146450.0000 }
        profitLoss: { type: number, example: 5000.0050 }
        lastTransactionDate: { type: string, format: date-time, nullable: true, example: '2026-07-30T11:00:00' }
    InvestmentOverviewResponse:
      type: object
      required: [userId, portfolioAccountId, positions]
      properties:
        userId: { type: integer, format: int64, example: 10 }
        portfolioAccountId: { type: integer, format: int64, example: 1 }
        positions:
          type: array
          items: { $ref: '#/components/schemas/InvestmentPositionResponse' }

x-reusable-http-templates:
  GET:
    request: No request body; supply documented path/query parameters and Accept application/json.
    success: HTTP 200 with the operation response schema.
    exampleRef: '#/components/examples/GetResponseTemplate'
  POST:
    request: Content-Type application/json with the operation request schema.
    success: HTTP 201 for resource creation, HTTP 200 for Bank debit/credit, or HTTP 204 for internal Portfolio commands.
    requestExampleRef: '#/components/examples/PostRequestTemplate'
    responseExampleRef: '#/components/examples/PostResponseTemplate'
  PUT:
    request: Content-Type application/json; send all fields required by the operation schema.
    success: HTTP 200 with the replaced resource.
    requestExampleRef: '#/components/examples/PutRequestTemplate'
    responseExampleRef: '#/components/examples/PutResponseTemplate'
  PATCH:
    request: Content-Type application/json when a body is documented; make-primary has no body.
    success: HTTP 200 with the updated resource.
    requestExampleRef: '#/components/examples/PatchRequestTemplate'
    responseExampleRef: '#/components/examples/PatchResponseTemplate'
  DELETE:
    request: No request body.
    success: HTTP 204 with no response body.
    responseExampleRef: '#/components/examples/DeleteResponseTemplate'
