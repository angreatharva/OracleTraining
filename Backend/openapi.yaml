openapi: 3.0.3
info:
  title: WealthTrack Microservice Ecosystem API
  version: 1.0.0
  description: |
    Code-derived API contract for every custom controller outside `MAIN`.

    **Authentication:** no Spring Security configuration, authentication filter, or
    authorization policy exists in the reviewed services. Every operation therefore
    declares `security: []`. The reusable 401 and 403 responses are future-security
    templates only and are not currently emitted by application authentication.

    **Headers:** JSON operations accept `Content-Type: application/json` and normally
    return `application/json`; clients may send `Accept: application/json`. Delete and
    internal command operations return no body. There are no application-specific
    request headers in the source code.

    **Gateway use:** each business path has a direct-service server and an API Gateway
    server. The gateway removes `/user`, `/bank`, `/portfolio`, `/trading`, or
    `/product` before forwarding. Internal endpoints are not access-controlled and are
    also reachable through the gateway as currently configured.

    **Uncertain/framework contracts:** Eureka exposes its library-managed dashboard and
    discovery protocol under `/eureka/**`, but the repository defines no custom Eureka
    controller or DTO contract. Those framework endpoints are described in
    `MICROSERVICE_API_MAP.md` and deliberately not invented here.
servers:
  - url: http://localhost:8081
    description: API Gateway (use a service prefix before the documented path)
tags:
  - name: Gateway
    description: API Gateway circuit-breaker fallback controllers
  - name: User - Roles
  - name: User - Users
  - name: User - Details
  - name: Bank - Accounts
  - name: Bank - KYC
  - name: Portfolio
  - name: Portfolio - Internal
  - name: Product - Types
  - name: Product - Products
  - name: Trading - Transactions
  - name: Trading - Statements
  - name: Trading - Overview
  - name: Auth

# Applies to every operation. POST /api/auth/login overrides it with `security: []`
# because it is the endpoint that issues the token.
security:
  - bearerAuth: []

paths:
  /api/auth/login:
    servers:
      - url: http://localhost:8082
        description: User Service (direct)
      - url: http://localhost:8081/user
        description: API Gateway
    post:
      tags: [Auth]
      operationId: login
      summary: Exchange email and password for a bearer token
      description: >
        The only unauthenticated endpoint in the system. A wrong password and an unknown
        email both return the same 401 so the endpoint cannot be used to discover which
        accounts exist.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/auth/me:
    servers:
      - url: http://localhost:8082
        description: User Service (direct)
      - url: http://localhost:8081/user
        description: API Gateway
    get:
      tags: [Auth]
      operationId: currentUser
      summary: Read the signed-in user
      description: Lets a client rebuild its session from a stored token.
      responses:
        '200':
          description: The authenticated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/auth/change-password:
    servers:
      - url: http://localhost:8082
        description: User Service (direct)
      - url: http://localhost:8081/user
        description: API Gateway
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change your own password
      description: >
        Always acts on the caller's own account; a userId is deliberately not accepted.
        Returns 401 if currentPassword is wrong.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Password changed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /userFallback:
    servers:
      - url: http://localhost:8081
        description: API Gateway
    get:
      tags: [Gateway]
      operationId: gatewayUserFallback
      summary: User Service circuit-breaker fallback
      description: Returns a plain-text availability message when the User Service gateway route times out or its circuit breaker falls back.
      security: []
      responses:
        '200':
          description: Fallback message
          content:
            text/plain:
              schema:
                type: string
              example: |-
                User service is taking longer than expected
                Please try after sometime
        '500':
          $ref: '#/components/responses/InternalServerError'
  /bankFallback:
    servers:
      - url: http://localhost:8081
        description: API Gateway
    get:
      tags: [Gateway]
      operationId: gatewayBankFallback
      summary: Bank Service circuit-breaker fallback
      description: Returns the gateway's plain-text Bank Service availability message.
      security: []
      responses:
        '200':
          description: Fallback message
          content:
            text/plain:
              schema: { type: string }
              example: |-
                Bank service is taking longer than expected
                Please try after sometime
        '500':
          $ref: '#/components/responses/InternalServerError'
  /portfolioFallback:
    servers:
      - url: http://localhost:8081
        description: API Gateway
    get:
      tags: [Gateway]
      operationId: gatewayPortfolioFallback
      summary: Portfolio Service circuit-breaker fallback
      description: Returns the gateway's plain-text Portfolio Service availability message.
      security: []
      responses:
        '200':
          description: Fallback message
          content:
            text/plain:
              schema: { type: string }
              example: |-
                Portfolio service is taking longer than expected
                Please try after sometime
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tradingFallback:
    servers:
      - url: http://localhost:8081
        description: API Gateway
    get:
      tags: [Gateway]
      operationId: gatewayTradingFallback
      summary: Trading Service circuit-breaker fallback
      description: Returns the gateway's plain-text Trading Service availability message.
      security: []
      responses:
        '200':
          description: Fallback message
          content:
            text/plain:
              schema: { type: string }
              example: |-
                Trading service is taking longer than expected
                Please try after sometime
        '500':
          $ref: '#/components/responses/InternalServerError'
  /productFallback:
    servers:
      - url: http://localhost:8081
        description: API Gateway
    get:
      tags: [Gateway]
      operationId: gatewayProductFallback
      summary: Product Service circuit-breaker fallback
      description: Returns the gateway's plain-text Product Service availability message.
      security: []
      responses:
        '200':
          description: Fallback message
          content:
            text/plain:
              schema: { type: string }
              example: |-
                Product service is taking longer than expected
                Please try after sometime
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/roles:
    servers:
      - url: http://localhost:8082
        description: User Service direct
      - url: http://localhost:8081/user
        description: User Service through API Gateway
    post:
      tags: [User - Roles]
      operationId: createRole
      summary: Create a role
      description: Creates a uniquely named role. Duplicate role names are reported as 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
            example:
              roleName: RELATIONSHIP_MANAGER
      responses:
        '201':
          description: Role created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
              example:
                roleId: 3
                roleName: RELATIONSHIP_MANAGER
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    get:
      tags: [User - Roles]
      operationId: listRoles
      summary: List roles
      description: Returns all roles. No query parameters are implemented.
      responses:
        '200':
          description: Role list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoleResponse' }
              example:
                - roleId: 1
                  roleName: CUSTOMER
                - roleId: 2
                  roleName: RELATIONSHIP_MANAGER
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/roles/{id}:
    servers:
      - url: http://localhost:8082
        description: User Service direct
      - url: http://localhost:8081/user
        description: User Service through API Gateway
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [User - Roles]
      operationId: getRoleById
      summary: Get a role by ID
      description: Finds one role by its database identifier.
      responses:
        '200':
          description: Role found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleResponse' }
              example: { roleId: 1, roleName: CUSTOMER }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [User - Roles]
      operationId: updateRole
      summary: Replace a role
      description: Replaces the role name after enforcing uniqueness.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
            example: { roleName: SENIOR_RELATIONSHIP_MANAGER }
      responses:
        '200':
          description: Updated role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleResponse' }
              example: { roleId: 2, roleName: SENIOR_RELATIONSHIP_MANAGER }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [User - Roles]
      operationId: deleteRole
      summary: Delete an unused role
      description: Deletes the role only when no user is assigned to it.
      responses:
        '204':
          description: Role deleted; no response body
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/roles/name/{roleName}:
    servers:
      - url: http://localhost:8082
        description: User Service direct
      - url: http://localhost:8081/user
        description: User Service through API Gateway
    get:
      tags: [User - Roles]
      operationId: getRoleByName
      summary: Get a role by name
      description: Looks up a role by its roleName value.
      parameters:
        - name: roleName
          in: path
          required: true
          schema: { type: string }
          example: CUSTOMER
      responses:
        '200':
          description: Role found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleResponse' }
              example: { roleId: 1, roleName: CUSTOMER }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/users:
    servers:
      - url: http://localhost:8082
        description: User Service direct
      - url: http://localhost:8081/user
        description: User Service through API Gateway
    post:
      tags: [User - Users]
      operationId: createUser
      summary: Create a user
      description: Creates a user for an existing role and optional existing manager. Status defaults to ACTIVE. Email must be unique.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
            example:
              roleId: 2
              managerId: 1
              password: "Investor@123"
              email: atharva.angre@example.com
              fullName: Atharva Angre
              phone: "+919876543210"
              status: ACTIVE
      responses:
        '201':
          description: User created; the password is never returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
              example:
                userId: 10
                roleId: 1
                managerId: 2
                email: atharva.angre@example.com
                fullName: Atharva Angre
                phone: "+919876543210"
                status: ACTIVE
                createdAt: '2026-07-30T10:15:30'
                updatedAt: '2026-07-30T10:15:30'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    get:
      tags: [User - Users]
      operationId: listUsers
      summary: List users
      description: Returns every user; filtering is provided by the role and manager endpoints rather than query parameters.
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserResponse' }
              example:
                - userId: 10
                  roleId: 1
                  managerId: 2
                  email: atharva.angre@example.com
                  fullName: Atharva Angre
                  phone: "+919876543210"
                  status: ACTIVE
                  createdAt: '2026-07-30T10:15:30'
                  updatedAt: '2026-07-30T10:15:30'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/users/{id}:
    servers:
      - url: http://localhost:8082
        description: User Service direct
      - url: http://localhost:8081/user
        description: User Service through API Gateway
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [User - Users]
      operationId: getUserById
      summary: Get a user by ID
      description: Returns one user. Bank and Portfolio consume this endpoint to validate that referenced users exist and are ACTIVE.
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
              example:
                userId: 10
                roleId: 1
                managerId: 2
                email: atharva.angre@example.com
                fullName: Atharva Angre
                phone: "+919876543210"
                status: ACTIVE
                createdAt: '2026-07-30T10:15:30'
                updatedAt: '2026-07-30T10:15:30'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [User - Users]
      operationId: updateUser
      summary: Replace a user
      description: >
        Replaces role, manager, contact fields and status. The role and manager must exist;
        email remains unique. Does not touch the password - use
        POST /api/auth/change-password. MANAGER only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
            example:
              roleId: 2
              managerId: 1
              email: atharva.angre@example.com
              fullName: Atharva A. Angre
              phone: "+919876543210"
              status: ACTIVE
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
              example:
                userId: 10
                roleId: 1
                managerId: 2
                email: atharva.angre@example.com
                fullName: Atharva A. Angre
                phone: "+919876543210"
                status: ACTIVE
                createdAt: '2026-07-30T10:15:30'
                updatedAt: '2026-07-30T11:00:00'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [User - Users]
      operationId: deleteUser
      summary: Delete a user
      description: Deletes a user only when the user manages no subordinates. Database relationships may impose additional constraints.
      responses:
        '204': { description: User deleted; no response body }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/users/email/{email}:
    servers:
      - url: http://localhost:8082
        description: User Service direct
      - url: http://localhost:8081/user
        description: User Service through API Gateway
    get:
      tags: [User - Users]
      operationId: getUserByEmail
      summary: Get a user by email
      description: Finds the unique user whose email exactly matches the path value. URL-encode special characters when needed.
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string, format: email }
          example: atharva.angre@example.com
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/users/role/{roleId}:
    servers:
      - url: http://localhost:8082
        description: User Service direct
      - url: http://localhost:8081/user
        description: User Service through API Gateway
    get:
      tags: [User - Users]
      operationId: listUsersByRole
      summary: List users assigned to a role
      description: Returns an empty array when no users reference the supplied role ID; the role itself is not separately validated.
      parameters:
        - $ref: '#/components/parameters/RoleId'
      responses:
        '200':
          description: Matching users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserResponse' }
              example: []
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/users/manager/{managerId}:
    servers:
      - url: http://localhost:8082
        description: User Service direct
      - url: http://localhost:8081/user
        description: User Service through API Gateway
    get:
      tags: [User - Users]
      operationId: listUsersByManager
      summary: List a manager's direct subordinates
      description: Returns users whose manager foreign key equals managerId; an unknown manager produces an empty array.
      parameters:
        - name: managerId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
          example: 2
      responses:
        '200':
          description: Matching users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserResponse' }
              example:
                - userId: 10
                  roleId: 1
                  managerId: 2
                  email: atharva.angre@example.com
                  fullName: Atharva Angre
                  phone: "+919876543210"
                  status: ACTIVE
                  createdAt: '2026-07-30T10:15:30'
                  updatedAt: '2026-07-30T10:15:30'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/user-details:
    servers:
      - url: http://localhost:8082
        description: User Service direct
      - url: http://localhost:8081/user
        description: User Service through API Gateway
    post:
      tags: [User - Details]
      operationId: createUserDetail
      summary: Create a user's investment profile
      description: Creates at most one detail record for an existing user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserDetailRequest' }
            example:
              userId: 10
              dateOfBirth: '1998-04-12'
              riskLevel: MODERATE
              riskScore: 62
              kycStatus: VERIFIED
      responses:
        '201':
          description: User detail created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetailResponse' }
              example:
                userDetailId: 5
                userId: 10
                dateOfBirth: '1998-04-12'
                riskLevel: MODERATE
                riskScore: 62
                kycStatus: VERIFIED
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    get:
      tags: [User - Details]
      operationId: listUserDetails
      summary: List user detail records
      description: Returns every stored investment profile.
      responses:
        '200':
          description: User detail list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserDetailResponse' }
              example:
                - userDetailId: 5
                  userId: 10
                  dateOfBirth: '1998-04-12'
                  riskLevel: MODERATE
                  riskScore: 62
                  kycStatus: VERIFIED
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/user-details/{id}:
    servers:
      - url: http://localhost:8082
        description: User Service direct
      - url: http://localhost:8081/user
        description: User Service through API Gateway
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [User - Details]
      operationId: getUserDetailById
      summary: Get a user detail by ID
      description: Finds one profile by userDetailId.
      responses:
        '200':
          description: User detail found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [User - Details]
      operationId: updateUserDetail
      summary: Replace a user detail
      description: Replaces all profile fields and may associate the record with a different existing user when that user has no detail record.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserDetailRequest' }
            example:
              userId: 10
              dateOfBirth: '1998-04-12'
              riskLevel: HIGH
              riskScore: 78
              kycStatus: VERIFIED
      responses:
        '200':
          description: Updated user detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [User - Details]
      operationId: deleteUserDetail
      summary: Delete a user detail
      description: Permanently deletes the profile record.
      responses:
        '204': { description: User detail deleted; no response body }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/user-details/user/{userId}:
    servers:
      - url: http://localhost:8082
        description: User Service direct
