      operationId: deleteInvestmentProduct
      summary: Delete an investment product
      description: Permanently deletes the product. The service contains no explicit cross-service holding/trade check; database constraints may still reject deletion.
      responses:
        '204': { description: Investment product deleted; no response body }
        '401': { $ref: '#/components/responses/Unauthorized' }
