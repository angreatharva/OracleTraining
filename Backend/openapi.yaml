  /api/portfolios/internal/trades/validate:
    servers:
      - url: http://localhost:8084
        description: Portfolio Service direct
      - url: http://localhost:8081/portfolio
        description: Portfolio Service through API Gateway
    post:
      tags: [Portfolio - Internal]
      operationId: validatePortfolioTrade
      summary: Pre-validate a trade command
      description: |
        Internal synchronous REST contract consumed by Trading before money moves.
        Confirms active portfolio, matching portfolio/holding/product IDs, BUY or SELL
        type, and sufficient SELL quantity. Despite its internal role, no authentication
        or gateway exclusion protects it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyTradeRequest' }
            example:
              portfolioAccountId: 1
              holdingId: 1
              productId: 1
              transactionType: BUY
              quantity: 1.0000
              unitPrice: 1450.0000
              transactionId: 8
      responses:
        '204': { description: Trade is valid; no response body }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/portfolios/internal/trades:
    servers:
      - url: http://localhost:8084
        description: Portfolio Service direct
      - url: http://localhost:8081/portfolio
        description: Portfolio Service through API Gateway
    post:
      tags: [Portfolio - Internal]
      operationId: applyCompletedPortfolioTrade
      summary: Apply an already-funded trade
      description: |
        Internal command used by Trading after the corresponding bank step. Re-runs
        validation, then increases quantity and weighted average cost for BUY or
        decreases quantity for SELL. The supplied unitPrice sets marketValue. The
        transactionId is validated as positive but is not persisted or deduplicated,
        so the endpoint is not idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyTradeRequest' }
            example:
              portfolioAccountId: 1
              holdingId: 1
              productId: 1
              transactionType: BUY
              quantity: 1.0000
              unitPrice: 1450.0000
              transactionId: 8
      responses:
        '204': { description: Trade applied; no response body }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
