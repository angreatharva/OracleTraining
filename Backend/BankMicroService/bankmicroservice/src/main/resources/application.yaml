server:
  port: ${BANK_SERVER_PORT:8083}

spring:
  config:
    import:
      # Resolved against the process working directory, which varies: `mvn spring-boot:run`
      # uses the service folder, while an IDE run configuration usually uses the repository
      # or Backend root. All plausible roots are listed so the .env is found either way.
      - optional:file:./.env[.properties]
      - optional:file:BankMicroService/bankmicroservice/.env[.properties]
      - optional:file:Backend/BankMicroService/bankmicroservice/.env[.properties]

  application:
    name: ${BANK_APPLICATION_NAME:BANK-SERVICE}

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${BANK_FEIGN_CONNECT_TIMEOUT_MS:3000}
            readTimeout: ${BANK_FEIGN_READ_TIMEOUT_MS:10000}

  datasource:
    url: ${BANK_DB_URL:jdbc:mysql://localhost:3306/mydb}
    driver-class-name: ${BANK_DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${BANK_DB_USERNAME:root}
    password: ${BANK_DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${BANK_JPA_DDL_AUTO:update}
    show-sql: ${BANK_JPA_SHOW_SQL:true}

wealthtrack:
  jwt:
    # No default on purpose: a missing secret must fail startup rather than start the
    # service with an empty signing key. Must match every other service's value.
    secret: ${BANK_JWT_SECRET}
    issuer: ${BANK_JWT_ISSUER:wealthtrack}
    expiry-seconds: ${BANK_JWT_EXPIRY_SECONDS:3600}

eureka:
  client:
    register-with-eureka: ${BANK_EUREKA_REGISTER:true}
    fetch-registry: ${BANK_EUREKA_FETCH_REGISTRY:true}
    service-url:
      defaultZone: ${BANK_EUREKA_URL:http://localhost:8080/eureka/}
  instance:
    hostname: ${BANK_EUREKA_HOSTNAME:localhost}
