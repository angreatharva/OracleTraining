server:
  port: ${EUREKA_SERVER_PORT:8080}

spring:
  config:
    import:
      # Resolved against the process working directory, which varies: `mvn spring-boot:run`
      # uses the service folder, while an IDE run configuration usually uses the repository
      # or Backend root. All plausible roots are listed so the .env is found either way.
      - optional:file:./.env[.properties]
      - optional:file:EurekaServer/eurekaserver/.env[.properties]
      - optional:file:Backend/EurekaServer/eurekaserver/.env[.properties]

  application:
    name: ${EUREKA_APPLICATION_NAME:WTMS-EUREKA-SERVER}

eureka:
  client:
    register-with-eureka: ${EUREKA_REGISTER:false}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8080/eureka/}

  server:
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:true}
