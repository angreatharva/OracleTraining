server:
  port: ${GATEWAY_SERVER_PORT:8081}

spring:
  config:
    import:
      # Resolved against the process working directory, which varies: `mvn spring-boot:run`
      # uses the service folder, while an IDE run configuration usually uses the repository
      # or Backend root. All plausible roots are listed so the .env is found either way.
      - optional:file:./.env[.properties]
      - optional:file:APIGateway/apigateway/.env[.properties]
      - optional:file:Backend/APIGateway/apigateway/.env[.properties]

  application:
    name: ${GATEWAY_APPLICATION_NAME:WTMS-GATEWAY}

  cloud:
    gateway:
      server:
        webflux:
          # Browser clients (the Oracle JET frontend) run on a different origin to the
          # gateway, so without this every call fails preflight. Origins are configurable so
          # a deployed frontend does not need a code change.
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${GATEWAY_CORS_ORIGINS:http://localhost:8000}
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: "*"
                exposedHeaders: "*"
                allowCredentials: true
                maxAge: 3600

          routes:
            - id: USER-SERVICE
              uri: lb://USER-SERVICE
              predicates:
                - Path=/user/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: USER-SERVICE
                    fallbackuri: forward:/userFallback

            - id: BANK-SERVICE
              uri: lb://BANK-SERVICE
              predicates:
                - Path=/bank/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: BANK-SERVICE
                    fallbackuri: forward:/bankFallback

            - id: PORTFOLIO-SERVICE
              uri: lb://PORTFOLIO-SERVICE
              predicates:
                - Path=/portfolio/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: PORTFOLIO-SERVICE
                    fallbackuri: forward:/portfolioFallback

            - id: TRADING-SERVICE
              uri: lb://TRADING-SERVICE
              predicates:
                - Path=/trading/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: TRADING-SERVICE
                    fallbackuri: forward:/tradingFallback

            - id: PRODUCT-SERVICE
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/product/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: PRODUCT-SERVICE
                    fallbackuri: forward:/productFallback

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
  timelimiter:
    configs:
      default:
        timeout-duration: ${GATEWAY_TIMEOUT_DURATION:5s}

wealthtrack:
  jwt:
    # No default on purpose: a missing secret must fail startup rather than let the gateway
    # come up unable to verify any token. Must match every service's value.
    secret: ${GATEWAY_JWT_SECRET}
    issuer: ${GATEWAY_JWT_ISSUER:wealthtrack}
    expiry-seconds: ${GATEWAY_JWT_EXPIRY_SECONDS:3600}

eureka:
  client:
    register-with-eureka: ${GATEWAY_EUREKA_REGISTER:true}
    fetch-registry: ${GATEWAY_EUREKA_FETCH_REGISTRY:true}
    service-url:
      defaultZone: ${GATEWAY_EUREKA_URL:http://localhost:8080/eureka/}
  instance:
    hostname: ${GATEWAY_EUREKA_HOSTNAME:localhost}


springdoc:
  # Path for the interactive Swagger UI HTML page
  swagger-ui:
    path: ${GATEWAY_SWAGGER_UI_PATH:/swagger-ui.html}
    operations-sorter: alpha # Sorts endpoints alphabetically
    tags-sorter: alpha       # Sorts tags/controllers alphabetically

  # Path for the raw OpenAPI JSON specification
  api-docs:
    path: ${GATEWAY_API_DOCS_PATH:/v3/api-docs}
