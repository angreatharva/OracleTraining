spring:
  datasource:
    url: jdbc:h2:mem:user_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

wealthtrack:
  jwt:
    # Test-only signing key. The real one comes from USER_JWT_SECRET in .env, which tests
    # deliberately do not load. Must still be >= 32 characters for HS256.
    secret: test-only-jwt-secret-not-used-outside-tests
    issuer: wealthtrack
    expiry-seconds: 3600

eureka:
  client:
    enabled: false
