server:
  port: ${USER_SERVER_PORT:8082}

spring:
  config:
    import:
      # Resolved against the process working directory, which varies: `mvn spring-boot:run`
      # uses the service folder, while an IDE run configuration usually uses the repository
      # or Backend root. All plausible roots are listed so the .env is found either way.
      - optional:file:./.env[.properties]
      - optional:file:UserMicroService/usermicroservice/.env[.properties]
      - optional:file:Backend/UserMicroService/usermicroservice/.env[.properties]

  application:
    name: ${USER_APPLICATION_NAME:USER-SERVICE}

  datasource:
    url: ${USER_DB_URL:jdbc:mysql://localhost:3306/mydb}
    driver-class-name: ${USER_DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${USER_DB_USERNAME:root}
    password: ${USER_DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${USER_JPA_DDL_AUTO:update}
    show-sql: ${USER_JPA_SHOW_SQL:true}

wealthtrack:
  jwt:
    # No default on purpose: a missing secret must fail startup loudly rather than start the
    # service with an empty signing key. The same value must be set for every service.
    secret: ${USER_JWT_SECRET}
    issuer: ${USER_JWT_ISSUER:wealthtrack}
    expiry-seconds: ${USER_JWT_EXPIRY_SECONDS:3600}

eureka:
  client:
    register-with-eureka: ${USER_EUREKA_REGISTER:true}
    fetch-registry: ${USER_EUREKA_FETCH_REGISTRY:true}
    registry-fetch-interval-seconds: ${USER_EUREKA_FETCH_INTERVAL_SECONDS:5}
    service-url:
      defaultZone: ${USER_EUREKA_URL:http://localhost:8080/eureka/}
  instance:
    hostname: ${USER_EUREKA_HOSTNAME:localhost}
