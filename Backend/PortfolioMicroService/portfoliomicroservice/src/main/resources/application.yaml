server:
  port: ${PORTFOLIO_SERVER_PORT:8084}

spring:
  config:
    import:
      # Resolved against the process working directory, which varies: `mvn spring-boot:run`
      # uses the service folder, while an IDE run configuration usually uses the repository
      # or Backend root. All plausible roots are listed so the .env is found either way.
      - optional:file:./.env[.properties]
      - optional:file:PortfolioMicroService/portfoliomicroservice/.env[.properties]
      - optional:file:Backend/PortfolioMicroService/portfoliomicroservice/.env[.properties]

  application:
    name: ${PORTFOLIO_APPLICATION_NAME:PORTFOLIO-SERVICE}

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${PORTFOLIO_FEIGN_CONNECT_TIMEOUT_MS:3000}
            readTimeout: ${PORTFOLIO_FEIGN_READ_TIMEOUT_MS:10000}

  datasource:
    url: ${PORTFOLIO_DB_URL:jdbc:mysql://localhost:3306/mydb}
    driver-class-name: ${PORTFOLIO_DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${PORTFOLIO_DB_USERNAME:root}
    password: ${PORTFOLIO_DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${PORTFOLIO_JPA_DDL_AUTO:update}
    show-sql: ${PORTFOLIO_JPA_SHOW_SQL:true}

wealthtrack:
  jwt:
    # No default on purpose: a missing secret must fail startup rather than start the
    # service with an empty signing key. Must match every other service's value.
    secret: ${PORTFOLIO_JWT_SECRET}
    issuer: ${PORTFOLIO_JWT_ISSUER:wealthtrack}
    expiry-seconds: ${PORTFOLIO_JWT_EXPIRY_SECONDS:3600}

eureka:
  client:
    register-with-eureka: ${PORTFOLIO_EUREKA_REGISTER:true}
    fetch-registry: ${PORTFOLIO_EUREKA_FETCH_REGISTRY:true}
    service-url:
      defaultZone: ${PORTFOLIO_EUREKA_URL:http://localhost:8080/eureka/}
  instance:
    hostname: ${PORTFOLIO_EUREKA_HOSTNAME:localhost}
