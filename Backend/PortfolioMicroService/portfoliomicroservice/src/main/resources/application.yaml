server:
  port: ${PORTFOLIO_SERVER_PORT:8084}

spring:
  config:
    import:
      - optional:file:portfolioMicroService/portfoliomicroservice/.env[.properties]
      - optional:file:portfoliomicroservice/.env[.properties]
      - optional:file:.env[.properties]

  application:
    name: ${PORTFOLIO_APPLICATION_NAME:PORTFOLIO-SERVICE}

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${PORTFOLIO_FEIGN_CONNECT_TIMEOUT_MS:3000}
            readTimeout: ${PORTFOLIO_FEIGN_READ_TIMEOUT_MS:10000}

  datasource:
    url: ${PORTFOLIO_DB_URL:jdbc:mysql://localhost:3306/mydb}
    driver-class-name: ${PORTFOLIO_DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${PORTFOLIO_DB_USERNAME:root}
    password: ${PORTFOLIO_DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${PORTFOLIO_JPA_DDL_AUTO:update}
    show-sql: ${PORTFOLIO_JPA_SHOW_SQL:true}

eureka:
  client:
    register-with-eureka: ${PORTFOLIO_EUREKA_REGISTER:true}
    fetch-registry: ${PORTFOLIO_EUREKA_FETCH_REGISTRY:true}
    service-url:
      defaultZone: ${PORTFOLIO_EUREKA_URL:http://localhost:8080/eureka/}
  instance:
    hostname: ${PORTFOLIO_EUREKA_HOSTNAME:localhost}
