<div class="oj-flex oj-sm-flex-direction-column">
  <h2 class="oj-typography-heading-md">Statements</h2>

  <oj-bind-if test="[[state.isLoading()]]">
    <div class="oj-sm-margin-4x"><oj-progress-circle size="md"></oj-progress-circle></div>
  </oj-bind-if>

  <oj-bind-if test="[[state.errorMessage()]]">
    <div role="alert" class="oj-sm-margin-2x-vertical oj-typography-body-md oj-text-color-danger">
      <oj-bind-text value="[[state.errorMessage]]"></oj-bind-text>
    </div>
  </oj-bind-if>

  <oj-bind-if test="[[isEmpty()]]">
    <p class="oj-typography-body-md oj-text-color-secondary">
      No statements yet. Statements are generated by the back office, not on request.
    </p>
  </oj-bind-if>

  <oj-bind-if test="[[selected()]]">
    <div class="oj-panel oj-sm-margin-2x-vertical">
      <h3 class="oj-typography-heading-sm">
        Statement #<oj-bind-text value="[[selected().statementId]]"></oj-bind-text>
      </h3>
      <div class="oj-typography-body-sm oj-text-color-secondary">
        <oj-bind-text value="[[format.date(selected().statementStart)]]"></oj-bind-text>
        &nbsp;to&nbsp;
        <oj-bind-text value="[[format.date(selected().statementEnd)]]"></oj-bind-text>
        &nbsp;&middot;&nbsp; generated
        <oj-bind-text value="[[format.dateTime(selected().generatedAt)]]"></oj-bind-text>
      </div>

      <div class="oj-flex oj-sm-margin-2x-vertical">
        <div class="oj-flex-item">
          <div class="oj-typography-body-sm oj-text-color-secondary">Opening</div>
          <div class="oj-typography-heading-sm">
            <oj-bind-text value="[[format.money(selected().openingValue)]]"></oj-bind-text>
          </div>
        </div>
        <div class="oj-flex-item">
          <div class="oj-typography-body-sm oj-text-color-secondary">Closing</div>
          <div class="oj-typography-heading-sm">
            <oj-bind-text value="[[format.money(selected().closingValue)]]"></oj-bind-text>
          </div>
        </div>
        <div class="oj-flex-item">
          <div class="oj-typography-body-sm oj-text-color-secondary">Movement</div>
          <div :class="[['oj-typography-heading-sm ' + movementClass()]]">
            <oj-bind-text value="[[format.signedMoney(movement())]]"></oj-bind-text>
          </div>
        </div>
      </div>

      <div class="oj-typography-body-sm">
        Transactions:
        <oj-bind-text value="[[(selected().transactionIds || []).join(', ') || '—']]"></oj-bind-text>
      </div>

      <oj-button on-oj-action="[[clearSelection]]" class="oj-sm-margin-2x-top">Close</oj-button>
    </div>
  </oj-bind-if>

  <oj-bind-if test="[[hasStatements()]]">
    <oj-bind-for-each data="[[statements]]">
      <template>
        <div class="oj-panel oj-sm-margin-1x-vertical">
          <div class="oj-flex oj-sm-align-items-center">
            <div class="oj-flex-item oj-typography-body-md">
              #<oj-bind-text value="[[$current.data.statementId]]"></oj-bind-text>
              &nbsp;
              <oj-bind-text value="[[$parent.format.date($current.data.statementStart)]]"></oj-bind-text>
              &ndash;
              <oj-bind-text value="[[$parent.format.date($current.data.statementEnd)]]"></oj-bind-text>
            </div>
            <div class="oj-sm-margin-2x-end oj-typography-body-md">
              <oj-bind-text value="[[$parent.format.money($current.data.closingValue)]]"></oj-bind-text>
            </div>
            <oj-button on-oj-action="[[function () { $parent.select($current.data); }]]">View</oj-button>
          </div>
        </div>
      </template>
    </oj-bind-for-each>
  </oj-bind-if>
</div>
