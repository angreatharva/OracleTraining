<div class="wtms-login-wrap">
  <div class="wtms-card wtms-login-card">

    <div class="wtms-login-brand">
      <div class="wtms-login-mark" aria-hidden="true">WT</div>
      <h1 class="wtms-page-title">WealthTrack</h1>
      <p class="wtms-page-subtitle">Sign in to continue</p>
    </div>

    <oj-c-message-banner data="[[messagesDP]]" type="section"></oj-c-message-banner>

    <oj-form-layout max-columns="1" direction="column" label-edge="inside">
      <oj-input-text id="email"
                     label-hint="Email"
                     value="{{email}}"
                     autocomplete="username">
      </oj-input-text>

      <oj-input-password id="password"
                         label-hint="Password"
                         value="{{password}}"
                         autocomplete="current-password">
      </oj-input-password>
    </oj-form-layout>

    <!-- Full-width call to action: there is only one thing to do on this screen. -->
    <oj-button id="signIn"
               class="oj-button-full-width oj-sm-margin-4x-top"
               chroming="callToAction"
               disabled="[[!canSubmit()]]"
               on-oj-action="[[submit]]">
      <oj-bind-text value="[[isSubmitting() ? 'Signing in...' : 'Sign in']]"></oj-bind-text>
    </oj-button>

  </div>
</div>
