<div class="oj-flex oj-sm-flex-direction-column">
  <h2 class="oj-typography-heading-md">My team</h2>
  <p class="oj-typography-body-sm oj-text-color-secondary">
    Investors who report to you. You can view their portfolios and trades, but not act on
    their behalf.
  </p>

  <oj-bind-if test="[[state.isLoading()]]">
    <div class="oj-sm-margin-4x"><oj-progress-circle size="md"></oj-progress-circle></div>
  </oj-bind-if>

  <oj-bind-if test="[[state.errorMessage()]]">
    <div role="alert" class="oj-sm-margin-2x-vertical oj-typography-body-md oj-text-color-danger">
      <oj-bind-text value="[[state.errorMessage]]"></oj-bind-text>
    </div>
  </oj-bind-if>

  <oj-bind-if test="[[isEmpty()]]">
    <p class="oj-typography-body-md oj-text-color-secondary">
      No investors are assigned to you yet. Use the Onboard screen to add one.
    </p>
  </oj-bind-if>

  <!-- Knockout foreach: $parent is undefined inside oj-bind-for-each and throws. -->
  <div data-bind="foreach: members">
    <div class="oj-panel oj-sm-margin-1x-vertical">
      <div class="oj-flex oj-sm-align-items-center">
        <div class="oj-flex-item">
          <div class="oj-typography-body-md">
            <strong data-bind="text: $data.fullName"></strong>
          </div>
          <div class="oj-typography-body-sm oj-text-color-secondary">
            <span data-bind="text: $data.email"></span>
            <span data-bind="visible: $data.phone">
              &middot; <span data-bind="text: $data.phone"></span>
            </span>
            &middot;
            <span data-bind="text: $data.status, css: $parent.format.statusClass($data.status)"></span>
          </div>
        </div>
        <oj-button data-bind="click: function () { $parent.openMember($data); }">
          View portfolio
        </oj-button>
      </div>
    </div>
  </div>
</div>
