<div class="wtms-page">

  <oj-bind-if test="[[noUser()]]">
    <div class="wtms-card">
      <div class="wtms-empty">
        <span class="wtms-empty-icon" aria-hidden="true">◷</span>
        <span class="wtms-empty-title">No investor selected</span>
        <span>Open this screen from the Team list.</span>
      </div>
    </div>
  </oj-bind-if>

  <oj-bind-if test="[[member()]]">
    <div class="wtms-page-header">
      <div class="wtms-identity">
        <oj-c-avatar size="lg"
                     background="purple"
                     initials="[[memberInitials()]]"
                     aria-hidden="true">
        </oj-c-avatar>
        <div class="wtms-identity-text">
          <span class="wtms-identity-name">
            <oj-bind-text value="[[member().fullName]]"></oj-bind-text>
          </span>
          <span class="wtms-identity-meta">
            <span><oj-bind-text value="[[member().email]]"></oj-bind-text></span>
            <oj-c-badge size="sm"
                        variant="[[format.statusVariant(member().status)]]"
                        label="[[member().status]]">
            </oj-c-badge>
            <oj-c-badge size="sm" variant="neutralSubtle" label="Read only"></oj-c-badge>
          </span>
        </div>
      </div>
    </div>
  </oj-bind-if>

  <oj-c-message-banner data="[[state.messagesDP]]" type="section"></oj-c-message-banner>

  <oj-bind-if test="[[state.isLoading()]]">
    <div class="wtms-loading"><oj-progress-circle size="md"></oj-progress-circle></div>
  </oj-bind-if>

  <oj-bind-if test="[[hasPositions()]]">

    <div class="oj-flex oj-flex-item-gutter">
      <div class="oj-flex-item oj-sm-12 oj-md-4">
        <div class="wtms-card wtms-kpi">
          <span class="wtms-kpi-label">Current value</span>
          <span class="wtms-kpi-value">
            <oj-bind-text value="[[format.money(totalValue())]]"></oj-bind-text>
          </span>
          <span class="wtms-kpi-caption">
            Across <oj-bind-text value="[[positions().length]]"></oj-bind-text> holdings
          </span>
        </div>
      </div>

      <div class="oj-flex-item oj-sm-12 oj-md-4">
        <div class="wtms-card wtms-kpi">
          <span class="wtms-kpi-label">Profit / loss</span>
          <span :class="[['wtms-kpi-value ' + profitLossClass()]]">
            <oj-bind-text value="[[format.signedMoney(totalProfitLoss())]]"></oj-bind-text>
          </span>
          <oj-c-meter-bar class="wtms-kpi-meter"
                          readonly="true"
                          min="-25"
                          max="25"
                          size="sm"
                          value="[[returnMeterValue()]]"
                          thresholds="[[returnMeterThresholds]]"
                          aria-label="Return on cost, percent">
          </oj-c-meter-bar>
          <span class="wtms-kpi-caption">
            <oj-bind-text value="[[format.percent(returnPercent()) + ' return on cost']]"></oj-bind-text>
          </span>
        </div>
      </div>

      <div class="oj-flex-item oj-sm-12 oj-md-4">
        <div class="wtms-card wtms-kpi">
          <span class="wtms-kpi-label">Trades on record</span>
          <span class="wtms-kpi-value"><oj-bind-text value="[[trades().length]]"></oj-bind-text></span>
          <span class="wtms-kpi-caption">Newest first below</span>
        </div>
      </div>
    </div>

    <oj-bind-if test="[[hasChartableData()]]">
      <div class="oj-flex oj-flex-item-gutter">
        <div class="oj-flex-item oj-sm-12 oj-lg-6">
          <div class="wtms-card">
            <div class="wtms-card-header">
              <h2 class="wtms-card-title">Allocation by value</h2>
            </div>
            <oj-chart id="memberAllocationChart"
                      class="wtms-chart"
                      type="pie"
                      data="[[allocationDP]]"
                      style-defaults='{"pieInnerRadius": 0.62}'
                      legend.position="bottom"
                      hover-behavior="dim"
                      animation-on-display="auto"
                      aria-label="Share of this investor's portfolio value in each product">
              <template slot="itemTemplate" data-oj-as="item">
                <oj-chart-item value="[[item.data.value]]"
                               series-id="[[item.data.series]]"
                               group-id="[[ ['Allocation'] ]]">
                </oj-chart-item>
              </template>
            </oj-chart>
          </div>
        </div>

        <div class="oj-flex-item oj-sm-12 oj-lg-6">
          <div class="wtms-card">
            <div class="wtms-card-header">
              <h2 class="wtms-card-title">Profit / loss by product</h2>
            </div>
            <oj-chart id="memberProfitLossChart"
                      class="wtms-chart"
                      type="bar"
                      orientation="horizontal"
                      data="[[profitLossDP]]"
                      legend.rendered="off"
                      hover-behavior="dim"
                      animation-on-display="auto"
                      aria-label="Profit or loss for each product">
              <template slot="itemTemplate" data-oj-as="item">
                <oj-chart-item value="[[item.data.value]]"
                               group-id="[[ [item.data.group] ]]"
                               series-id="[[item.data.group]]"
                               color="[[item.data.color]]">
                </oj-chart-item>
              </template>
            </oj-chart>
          </div>
        </div>
      </div>
    </oj-bind-if>

    <div class="wtms-card wtms-card-flush">
      <div class="wtms-card-header">
        <h2 class="wtms-card-title">Positions</h2>
      </div>
      <oj-table id="memberPositions"
                aria-label="Positions"
                data="[[positionsDP]]"
                class="wtms-list"
                columns='[
                  {"headerText": "Product",  "field": "productName"},
                  {"headerText": "Quantity", "field": "currentQuantity", "template": "qtyTemplate"},
                  {"headerText": "Avg cost", "field": "averageBuyPrice", "template": "moneyTemplate"},
                  {"headerText": "Price",    "field": "currentPrice", "template": "moneyTemplate"},
                  {"headerText": "Value",    "field": "currentValuation", "template": "valueTemplate"},
                  {"headerText": "P/L",      "field": "profitLoss", "template": "plTemplate"}
                ]'>

        <template slot="qtyTemplate" data-oj-as="cell">
          <span class="wtms-mono"><oj-bind-text value="[[format.quantity(cell.data)]]"></oj-bind-text></span>
        </template>

        <template slot="moneyTemplate" data-oj-as="cell">
          <span class="wtms-mono"><oj-bind-text value="[[format.money(cell.data)]]"></oj-bind-text></span>
        </template>

        <template slot="valueTemplate" data-oj-as="cell">
          <span class="wtms-amount"><oj-bind-text value="[[format.money(cell.data)]]"></oj-bind-text></span>
        </template>

        <template slot="plTemplate" data-oj-as="cell">
          <span :class="[['wtms-mono ' + format.profitLossClass(cell.data)]]">
            <oj-bind-text value="[[format.signedMoney(cell.data)]]"></oj-bind-text>
          </span>
        </template>
      </oj-table>
    </div>
  </oj-bind-if>

  <oj-bind-if test="[[!hasPositions() && !state.isLoading() && member()]]">
    <div class="wtms-card">
      <div class="wtms-empty">
        <span class="wtms-empty-icon" aria-hidden="true">◷</span>
        <span class="wtms-empty-title">No holdings</span>
        <span>This investor has not bought anything yet.</span>
      </div>
    </div>
  </oj-bind-if>

  <oj-bind-if test="[[hasTrades()]]">
    <div class="wtms-card wtms-card-flush">
      <div class="wtms-card-header">
        <h2 class="wtms-card-title">Recent trades</h2>
      </div>
      <oj-table id="memberTrades"
                aria-label="Trades"
                data="[[tradesDP]]"
                class="wtms-list"
                columns='[
                  {"headerText": "#",      "field": "transactionId", "className": "wtms-mono"},
                  {"headerText": "Date",   "field": "transactionDate", "template": "dateTemplate"},
                  {"headerText": "Type",   "field": "transactionType", "template": "typeTemplate"},
                  {"headerText": "Qty",    "field": "quantity", "template": "tradeQtyTemplate"},
                  {"headerText": "Total",  "field": "totalAmount", "template": "totalTemplate"},
                  {"headerText": "Status", "field": "transactionStatus", "template": "statusTemplate"}
                ]'>

        <template slot="dateTemplate" data-oj-as="cell">
          <span class="wtms-mono"><oj-bind-text value="[[format.dateTime(cell.data)]]"></oj-bind-text></span>
        </template>

        <template slot="typeTemplate" data-oj-as="cell">
          <oj-c-badge size="sm"
                      variant="[[format.tradeTypeVariant(cell.data)]]"
                      label="[[cell.data]]">
          </oj-c-badge>
        </template>

        <template slot="tradeQtyTemplate" data-oj-as="cell">
          <span class="wtms-mono"><oj-bind-text value="[[format.quantity(cell.data)]]"></oj-bind-text></span>
        </template>

        <template slot="totalTemplate" data-oj-as="cell">
          <span class="wtms-amount"><oj-bind-text value="[[format.money(cell.data)]]"></oj-bind-text></span>
        </template>

        <template slot="statusTemplate" data-oj-as="cell">
          <oj-c-badge size="sm"
                      variant="[[format.statusVariant(cell.data)]]"
                      label="[[cell.data]]">
          </oj-c-badge>
        </template>
      </oj-table>
    </div>
  </oj-bind-if>
</div>
