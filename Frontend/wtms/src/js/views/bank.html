<div class="oj-flex oj-sm-flex-direction-column">
  <h2 class="oj-typography-heading-md">Bank accounts</h2>

  <oj-bind-if test="[[state.isLoading()]]">
    <div class="oj-sm-margin-4x"><oj-progress-circle size="md"></oj-progress-circle></div>
  </oj-bind-if>

  <oj-bind-if test="[[state.errorMessage()]]">
    <div role="alert" class="oj-sm-margin-2x-vertical oj-typography-body-md oj-text-color-danger">
      <oj-bind-text value="[[state.errorMessage]]"></oj-bind-text>
    </div>
  </oj-bind-if>

  <oj-bind-if test="[[state.successMessage()]]">
    <div role="status" class="oj-sm-margin-2x-vertical oj-typography-body-md oj-text-color-success">
      <oj-bind-text value="[[state.successMessage]]"></oj-bind-text>
    </div>
  </oj-bind-if>

  <oj-bind-if test="[[isEmpty()]]">
    <p class="oj-typography-body-md oj-text-color-secondary">
      No bank accounts on file. Your manager can add one for you.
    </p>
  </oj-bind-if>

  <!--
    Knockout's foreach, NOT oj-bind-for-each. $parent is undefined inside oj-bind-for-each,
    and referencing it throws a binding error that silently removes the entire list from the
    DOM - the screen renders its heading and nothing else. Verified in the browser.
  -->
  <div data-bind="foreach: accounts">
    <div class="oj-panel oj-sm-margin-1x-vertical">
      <div class="oj-flex oj-sm-align-items-center">
        <div class="oj-flex-item">
          <div class="oj-typography-body-md">
            <strong data-bind="text: $data.bankName"></strong>
            <span data-bind="text: ' ' + $data.maskedAccountNumber"></span>
          </div>
          <div class="oj-typography-body-sm oj-text-color-secondary">
            <span data-bind="text: $data.accountType"></span>
            <span data-bind="visible: $data.branchName">
              &middot; <span data-bind="text: $data.branchName"></span>
            </span>
            &middot;
            <span data-bind="text: $data.status, css: $parent.format.statusClass($data.status)"></span>
            <span data-bind="visible: $data.primaryAccount">&middot; <strong>Primary</strong></span>
          </div>
        </div>

        <div class="oj-typography-heading-sm oj-sm-margin-2x-end"
             data-bind="text: $parent.format.money($data.balance)"></div>

        <oj-button data-bind="visible: !$data.primaryAccount && $data.status === 'ACTIVE',
                              click: function () { $parent.makePrimary($data); },
                              disable: $parent.busyAccountId() === $data.bankAccountId">
          Make primary
        </oj-button>
      </div>
    </div>
  </div>
</div>
