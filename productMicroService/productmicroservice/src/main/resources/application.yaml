server:
  port: ${PRODUCT_SERVER_PORT:8086}

spring:
  config:
    import:
      - optional:file:productMicroService/productmicroservice/.env[.properties]
      - optional:file:productmicroservice/.env[.properties]
      - optional:file:.env[.properties]

  application:
    name: ${PRODUCT_APPLICATION_NAME:PRODUCT-SERVICE}

  datasource:
    url: ${PRODUCT_DB_URL:jdbc:mysql://localhost:3306/mydb}
    driver-class-name: ${PRODUCT_DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${PRODUCT_DB_USERNAME:root}
    password: ${PRODUCT_DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${PRODUCT_JPA_DDL_AUTO:update}
    show-sql: ${PRODUCT_JPA_SHOW_SQL:true}

eureka:
  client:
    register-with-eureka: ${PRODUCT_EUREKA_REGISTER:true}
    fetch-registry: ${PRODUCT_EUREKA_FETCH_REGISTRY:true}
    service-url:
      defaultZone: ${PRODUCT_EUREKA_URL:http://localhost:8080/eureka/}
  instance:
    hostname: ${PRODUCT_EUREKA_HOSTNAME:localhost}
